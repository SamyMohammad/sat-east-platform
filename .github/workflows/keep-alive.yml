name: Keep staging awake
# docs/16 §7: free projects pause after 7 days without activity. Anon may read courses (row 3).
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
      PUBLISHABLE_KEY: ${{ vars.STAGING_PUBLISHABLE_KEY }}
    steps:
      - run: |
          [ -n "$SUPABASE_URL" ] && [ -n "$PUBLISHABLE_KEY" ] || { echo "::error::staging variables not set"; exit 1; }
          curl -fsS "$SUPABASE_URL/rest/v1/courses?select=id&limit=1" -H "apikey: $PUBLISHABLE_KEY"
