name: Load staging
# R1c (docs/setup/load-test.md). Manual only. Seeds load students on STAGING, runs k6
# against it, reports p95s + top SQL statements, then deletes the load students.
# Staging is unusable for other work while this runs.
on:
  workflow_dispatch:
    inputs:
      vus:
        description: Concurrent students (also the number of load users created)
        required: true
        default: '300'
      duration:
        description: Hold time at full load (k6 duration, e.g. 5m)
        required: true
        default: 5m
permissions:
  contents: read
concurrency:
  group: load-staging
  cancel-in-progress: false

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PROJECT_REF: ${{ vars.STAGING_PROJECT_REF }}
      SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
      PUBLISHABLE_KEY: ${{ vars.STAGING_PUBLISHABLE_KEY }}
      PROD_PROJECT_REF: ${{ vars.PROD_PROJECT_REF }}
      LOAD_USERS: ${{ inputs.vus }}
      LOAD_DURATION: ${{ inputs.duration }}
    steps:
      - name: Check config and refuse to run against prod
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
          STAGING_JWT_SECRET: ${{ secrets.STAGING_JWT_SECRET }}
        run: |
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD STAGING_JWT_SECRET \
                   PROJECT_REF SUPABASE_URL PUBLISHABLE_KEY; do
            [ -n "${!v}" ] || { echo "::error::$v is not set"; exit 1; }
          done
          # vars.PROD_PROJECT_REF lives on the production environment and is empty here,
          # so also refuse the known prod ref (public: it is part of the prod URL).
          if [ "$PROJECT_REF" = "xsoxzuxaqgymvuixebrw" ] || \
             { [ -n "$PROD_PROJECT_REF" ] && [ "$PROJECT_REF" = "$PROD_PROJECT_REF" ]; }; then
            echo "::error::STAGING_PROJECT_REF equals PROD_PROJECT_REF - refusing to load test prod"
            exit 1
          fi
          [[ "$LOAD_USERS" =~ ^[0-9]+$ ]] && (( LOAD_USERS >= 1 && LOAD_USERS <= 2000 )) \
            || { echo "::error::vus must be an integer between 1 and 2000"; exit 1; }
          [[ "$LOAD_DURATION" =~ ^[0-9]+[smh]$ ]] \
            || { echo "::error::duration must look like 90s, 5m or 1h"; exit 1; }
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: supabase/setup-cli@v3
        with:
          version: 2.117.0
      - name: Link staging
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
        run: supabase link --project-ref "$PROJECT_REF"
      - name: Reset pg_stat_statements and seed load users
        env:
          PGPASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
        run: |
          set -euo pipefail
          command -v psql >/dev/null || { sudo apt-get update && sudo apt-get install -y postgresql-client; }
          url="$(cat supabase/.temp/pooler-url)"
          psql "$url" -v ON_ERROR_STOP=1 -q -c "select extensions.pg_stat_statements_reset()" >/dev/null \
            || echo "::warning::pg_stat_statements_reset failed - top statements will include earlier traffic"
          psql "$url" -v ON_ERROR_STOP=1 -q -v n="$LOAD_USERS" -f scripts/load/seed_users.sql
      - name: Mint load tokens
        env:
          STAGING_JWT_SECRET: ${{ secrets.STAGING_JWT_SECRET }}
        run: node scripts/load/mint_tokens.mjs "$GITHUB_WORKSPACE/tokens.json"
      - uses: grafana/setup-k6-action@v1
        with:
          k6-version: '1.4.0'
      - name: Run k6
        env:
          VUS: ${{ inputs.vus }}
          DURATION: ${{ inputs.duration }}
          TOKENS_FILE: ${{ github.workspace }}/tokens.json
        run: k6 run load/k6/student_flow.js
      - name: Job summary (k6 + top SQL statements)
        if: ${{ !cancelled() }}
        env:
          PGPASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
        run: |
          set -uo pipefail
          [ -f summary.md ] && cat summary.md >> "$GITHUB_STEP_SUMMARY"
          [ -f supabase/.temp/pooler-url ] || exit 0
          url="$(cat supabase/.temp/pooler-url)"
          for order in total_exec_time mean_exec_time; do
            {
              echo
              echo "### Top 15 statements by $order"
              echo '```'
              psql "$url" -X -q -P pager=off -c "
                select calls,
                       round(total_exec_time::numeric, 0) as total_ms,
                       round(mean_exec_time::numeric, 1) as mean_ms,
                       round(max_exec_time::numeric, 0) as max_ms,
                       left(regexp_replace(query, '\s+', ' ', 'g'), 110) as query
                from extensions.pg_stat_statements
                order by $order desc
                limit 15" || echo "pg_stat_statements query failed"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Upload k6 summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: k6-summary
          path: |
            summary.json
            summary.md
          if-no-files-found: ignore
      # Always: remove the tokens and every load student, even after a failed or cancelled run.
      - name: Cleanup (tokens + load users)
        if: always()
        env:
          PGPASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
        run: |
          set -uo pipefail
          rm -f "$GITHUB_WORKSPACE/tokens.json"
          if [ ! -f supabase/.temp/pooler-url ]; then
            echo "::warning::staging was never linked - no load users were created"
            exit 0
          fi
          command -v psql >/dev/null || { sudo apt-get update && sudo apt-get install -y postgresql-client; }
          psql "$(cat supabase/.temp/pooler-url)" -v ON_ERROR_STOP=1 -q -f scripts/load/cleanup_users.sql
