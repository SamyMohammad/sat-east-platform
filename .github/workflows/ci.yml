name: CI
# F-3 (docs/16 §7). Branch protection on main requires the `ci-ok` aggregate check.
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  # Cancel stale PR runs only; never abort a run on main mid-deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read

jobs:
  # PRs only: decide which jobs a change can affect. On push to main every job runs.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      client: ${{ steps.filter.outputs.client }}
      db: ${{ steps.filter.outputs.db }}
      functions: ${{ steps.filter.outputs.functions }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            client:
              - 'apps/client/**'
              - 'supabase/tests/**'
              - 'scripts/secret-grep.sh'
              - 'scripts/tests/**'
              - '.github/workflows/ci.yml'
            db:
              - 'supabase/**'
              - 'scripts/api-private-check.ps1'
              - '.github/workflows/ci.yml'
            functions:
              - 'supabase/functions/**'
              - 'supabase/templates/**'
              - 'tools/**'
              - '.github/workflows/ci.yml'

  client-test:
    # `changes` is skipped on push; a skipped need would skip this job too, so the
    # !cancelled() guard (status check function) opts out of the implicit success().
    if: ${{ !cancelled() && needs.changes.result != 'failure' && (github.event_name != 'pull_request' || needs.changes.outputs.client == 'true') }}
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    defaults:
      run:
        working-directory: apps/client
    steps:
      # Full checkout: test/core/grading/spr_answer_test.dart reads ../../supabase/tests/.
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true
      - run: flutter pub get
      # Format and analyze cover the whole tree, so one shard is enough.
      - if: matrix.shard == 0
        run: dart format --output=none --set-exit-if-changed .
      - if: matrix.shard == 0
        run: flutter analyze --fatal-infos
      # Split by file, not --total-shards: that splits tests inside files, so every shard
      # would still compile all files (compile is most of the time). Round-robin over a
      # sorted list keeps shards balanced and deterministic.
      - name: flutter test (shard ${{ matrix.shard }} of 3, by file)
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find test -name '*_test.dart' -not -path 'test/goldens/*' | LC_ALL=C sort | awk -v s="$SHARD" '(NR - 1) % 3 == s')
          (( ${#files[@]} )) || { echo "::error::shard $SHARD has no test files"; exit 1; }
          echo "shard $SHARD: ${#files[@]} files"
          flutter test --exclude-tags golden "${files[@]}"

  client-build:
    if: ${{ !cancelled() && needs.changes.result != 'failure' && (github.event_name != 'pull_request' || needs.changes.outputs.client == 'true') }}
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true
      - run: flutter pub get
      - name: Write placeholder env (PR builds never deploy)
        run: |
          cat > env/ci.json <<'EOF'
          {"FLAVOR":"staging","SUPABASE_URL":"https://example.supabase.co","SUPABASE_PUBLISHABLE_KEY":"sb_publishable_ci","ENABLE_PURCHASE":true}
          EOF
      - run: flutter build web --release --dart-define-from-file=env/ci.json
      - run: bash ../../scripts/tests/secret-grep.test.sh
      - run: bash ../../scripts/secret-grep.sh build/web
      # Cloudflare Pages rejects any file over 25 MiB.
      - name: Check per-file size limit (25 MiB)
        run: |
          big="$(find build/web -type f -size +26214400c)"
          if [ -n "$big" ]; then
            echo "::error::files over 25 MiB (Cloudflare Pages limit):"
            echo "$big"
            exit 1
          fi
      # Guards against a web dir change silently dropping the Pages headers file.
      - name: Check build/web/_headers has the security headers
        run: |
          test -f build/web/_headers
          grep -q 'Content-Security-Policy' build/web/_headers
          grep -q 'Strict-Transport-Security' build/web/_headers

  db:
    if: ${{ !cancelled() && needs.changes.result != 'failure' && (github.event_name != 'pull_request' || needs.changes.outputs.db == 'true') }}
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 2.117.0
      # db + kong + postgrest for pgTAP and api-private-check. gotrue stays: without it
      # `supabase status` omits ANON_KEY / SERVICE_ROLE_KEY, which the check needs.
      - run: supabase start -x realtime,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - run: supabase test db
      - run: supabase db lint --fail-on error
      - run: pwsh scripts/api-private-check.ps1
      # Last in the job, after pgTAP/lint/api checks, so they see a clean DB. Uses psql inside the db
      # container (always present, no host psql/port/password assumptions; same as
      # scripts/db-seed-demo.ps1). `supabase db query --file` rejects multi-statement files.
      - name: "Demo seed: apply twice + check"
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(supabase/seeds/demo/[0-9]*.sql)
          (( ${#files[@]} )) || { echo "::error::no demo seed files"; exit 1; }
          db=supabase_db_sat-east-platform
          psqlf() { docker exec -i "$db" psql -U postgres -d postgres -v ON_ERROR_STOP=1 --single-transaction -q -f - < "$1"; }
          # Throwaway student first, so "enrol existing students" is exercised (check 8).
          psqlf supabase/seeds/demo/ci_fixture.sql
          for pass in 1 2; do
            for f in "${files[@]}"; do
              echo "pass $pass: $f"
              docker exec -i "$db" psql -U postgres -d postgres -v ON_ERROR_STOP=1 --single-transaction -q -f - < "$f"
            done
          done
          psqlf supabase/seeds/demo/check.sql
          # Remove the fixture (cascades to profile + enrolment); leave no residue.
          docker exec -i "$db" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -q -c "delete from auth.users where id = '00000000-0000-4000-8de0-0000000000f1'"

  # Deno tests + type-check for Edge Functions (docs/12). Spikes are not run here.
  functions:
    if: ${{ !cancelled() && needs.changes.result != 'failure' && (github.event_name != 'pull_request' || needs.changes.outputs.functions == 'true') }}
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6
      - run: deno test -A supabase/functions/
      - run: deno test -A tools/
      - run: deno check supabase/functions/*/index.ts supabase/templates/edge-function.ts

  # The single required check. Skipped jobs (path filter) are fine; failed or cancelled are not.
  ci-ok:
    if: always()
    needs: [changes, client-test, client-build, db, functions]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::a CI job failed or was cancelled"
          exit 1

  deploy:
    # Explicit results: `changes` is a skipped ancestor on push, and the implicit success()
    # would skip this job because of it.
    if: >-
      ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.client-test.result == 'success' && needs.client-build.result == 'success'
      && needs.db.result == 'success' && needs.functions.result == 'success' }}
    needs: [client-test, client-build, db, functions]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: staging
      cancel-in-progress: false
    # Secrets are scoped per step, so third-party build code never sees them.
    env:
      PROJECT_REF: ${{ vars.STAGING_PROJECT_REF }}
      SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
      PUBLISHABLE_KEY: ${{ vars.STAGING_PUBLISHABLE_KEY }}
      PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
      WRANGLER: wrangler@4.148.0
    steps:
      - name: Check config is present
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID \
                   PROJECT_REF SUPABASE_URL PUBLISHABLE_KEY PAGES_PROJECT; do
            [ -n "${!v}" ] || { echo "::error::$v is not set"; exit 1; }
          done
      - uses: actions/checkout@v7
      # Build and check the web bundle first, so a bad build never leaves staging with a
      # migrated schema and an old UI.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true
      # Web build = purchase surface (ADR-006), so ENABLE_PURCHASE is true.
      - name: Build web (staging)
        working-directory: apps/client
        env:
          # Public Turnstile site key; empty = captcha off (docs/setup/auth.md).
          TURNSTILE_SITE_KEY: ${{ vars.STAGING_TURNSTILE_SITE_KEY }}
          # Public DSN; empty = Sentry off (docs/setup/observability.md).
          SENTRY_DSN: ${{ vars.STAGING_SENTRY_DSN }}
        run: |
          jq -n --arg url "$SUPABASE_URL" --arg key "$PUBLISHABLE_KEY" --arg turnstile "$TURNSTILE_SITE_KEY" \
            --arg sentry "$SENTRY_DSN" --arg release "$GITHUB_SHA" \
            '{FLAVOR:"staging",SUPABASE_URL:$url,SUPABASE_PUBLISHABLE_KEY:$key,ENABLE_PURCHASE:true,TURNSTILE_SITE_KEY:$turnstile,
              SENTRY_DSN:$sentry,SENTRY_RELEASE:$release}' > env/staging.json
          flutter pub get
          flutter build web --release --source-maps --dart-define-from-file=env/staging.json
      - name: Upload source maps to Sentry, then strip them
        working-directory: apps/client
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_CLI: '@sentry/cli@3.8.2'
        run: |
          if [ -n "$SENTRY_AUTH_TOKEN" ] && [ -n "$SENTRY_ORG" ]; then
            npx -y "$SENTRY_CLI" sourcemaps upload --org "$SENTRY_ORG" --project client \
              --release "$GITHUB_SHA" build/web
          else
            echo '::notice::Sentry source maps skipped (SENTRY_AUTH_TOKEN / SENTRY_ORG not set)'
          fi
          # Maps never ship to Pages, whether or not they were uploaded.
          find build/web -name '*.map' -delete
          ! find build/web -name '*.map' | grep -q .
          bash ../../scripts/secret-grep.sh build/web
      # Created here, not by hand: wrangler run from an AI agent turns a new Pages project into
      # a Workers deploy (wrangler >= 4.130). CI is not an agent, so this stays on Pages (ADR-009).
      - name: Ensure Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx -y "$WRANGLER" pages project list \
            | grep -qE "(^|[^A-Za-z0-9_-])${PAGES_PROJECT}([^A-Za-z0-9_-]|$)" \
            || npx -y "$WRANGLER" pages project create "$PAGES_PROJECT" --production-branch=main
      - uses: supabase/setup-cli@v3
        with:
          version: 2.117.0
      - name: Migrate staging database
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
        run: |
          supabase link --project-ref "$PROJECT_REF"
          supabase db push
      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if find supabase/functions -mindepth 2 -name 'index.ts' | grep -q .; then
            supabase functions deploy --project-ref "$PROJECT_REF"
          else
            echo "No Edge Functions yet - skipped"
          fi
      - name: Deploy web to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y "$WRANGLER" pages deploy apps/client/build/web --project-name="$PAGES_PROJECT" --branch=main
      # Last on purpose: a seed failure must not block the web or Edge Function deploy.
      - name: Seed staging demo data
        env:
          PGPASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
        run: |
          # `supabase db query --file` rejects multi-statement files, so use
          # psql with the pooler URL that `supabase link` wrote above.
          set -euo pipefail
          command -v psql >/dev/null || { sudo apt-get update && sudo apt-get install -y postgresql-client; }
          url="$(cat supabase/.temp/pooler-url)"
          shopt -s nullglob
          files=(supabase/seeds/demo/[0-9]*.sql)
          (( ${#files[@]} )) || { echo "::error::no demo seed files"; exit 1; }
          for f in "${files[@]}"; do
            psql "$url" -v ON_ERROR_STOP=1 --single-transaction -q -f "$f"
          done
