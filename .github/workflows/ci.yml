name: CI
# F-3 (docs/16 §7). Advisory: the repo has no branch protection, so never merge on red.
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  # Cancel stale PR runs only; never abort a run on main mid-deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read

jobs:
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/client
    steps:
      # Full checkout: test/core/grading/spr_answer_test.dart reads ../../supabase/tests/.
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze --fatal-infos
      - run: flutter test --exclude-tags golden
      - name: Write placeholder env (PR builds never deploy)
        run: |
          cat > env/ci.json <<'EOF'
          {"FLAVOR":"staging","SUPABASE_URL":"https://example.supabase.co","SUPABASE_PUBLISHABLE_KEY":"sb_publishable_ci","ENABLE_PURCHASE":true}
          EOF
      - run: flutter build web --release --dart-define-from-file=env/ci.json
      - run: bash ../../scripts/tests/secret-grep.test.sh
      - run: bash ../../scripts/secret-grep.sh build/web

  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 2.117.0
      # db + kong + postgrest for pgTAP and api-private-check. gotrue stays: without it
      # `supabase status` omits ANON_KEY / SERVICE_ROLE_KEY, which the check needs.
      - run: supabase start -x realtime,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - run: supabase test db
      - run: supabase db lint --fail-on error
      - run: pwsh scripts/api-private-check.ps1
      # Last in the job, after pgTAP/lint/api checks, so they see a clean DB. Uses psql inside the db
      # container (always present, no host psql/port/password assumptions; same as
      # scripts/db-seed-demo.ps1). `supabase db query --file` rejects multi-statement files.
      - name: "Demo seed: apply twice + check"
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(supabase/seeds/demo/[0-9]*.sql)
          (( ${#files[@]} )) || { echo "::error::no demo seed files"; exit 1; }
          db=supabase_db_sat-east-platform
          psqlf() { docker exec -i "$db" psql -U postgres -d postgres -v ON_ERROR_STOP=1 --single-transaction -q -f - < "$1"; }
          # Throwaway student first, so "enrol existing students" is exercised (check 8).
          psqlf supabase/seeds/demo/ci_fixture.sql
          for pass in 1 2; do
            for f in "${files[@]}"; do
              echo "pass $pass: $f"
              docker exec -i "$db" psql -U postgres -d postgres -v ON_ERROR_STOP=1 --single-transaction -q -f - < "$f"
            done
          done
          psqlf supabase/seeds/demo/check.sql
          # Remove the fixture (cascades to profile + enrolment); leave no residue.
          docker exec -i "$db" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -q -c "delete from auth.users where id = '00000000-0000-4000-8de0-0000000000f1'"

  # Deno tests + type-check for Edge Functions (docs/12). Spikes are not run here.
  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6
      - run: deno test -A supabase/functions/
      - run: deno test -A tools/
      - run: deno check supabase/functions/*/index.ts supabase/templates/edge-function.ts

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [client, db, functions]
    runs-on: ubuntu-latest
    concurrency:
      group: staging
      cancel-in-progress: false
    # Secrets are scoped per step, so third-party build code never sees them.
    env:
      PROJECT_REF: ${{ vars.STAGING_PROJECT_REF }}
      SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
      PUBLISHABLE_KEY: ${{ vars.STAGING_PUBLISHABLE_KEY }}
      PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
      WRANGLER: wrangler@4.148.0
    steps:
      - name: Check config is present
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID \
                   PROJECT_REF SUPABASE_URL PUBLISHABLE_KEY PAGES_PROJECT; do
            [ -n "${!v}" ] || { echo "::error::$v is not set"; exit 1; }
          done
      - uses: actions/checkout@v7
      # Build and check the web bundle first, so a bad build never leaves staging with a
      # migrated schema and an old UI.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true
      # Web build = purchase surface (ADR-006), so ENABLE_PURCHASE is true.
      - name: Build web (staging)
        working-directory: apps/client
        run: |
          jq -n --arg url "$SUPABASE_URL" --arg key "$PUBLISHABLE_KEY" \
            '{FLAVOR:"staging",SUPABASE_URL:$url,SUPABASE_PUBLISHABLE_KEY:$key,ENABLE_PURCHASE:true}' > env/staging.json
          flutter pub get
          flutter build web --release --dart-define-from-file=env/staging.json
          bash ../../scripts/secret-grep.sh build/web
      # Created here, not by hand: wrangler run from an AI agent turns a new Pages project into
      # a Workers deploy (wrangler >= 4.130). CI is not an agent, so this stays on Pages (ADR-009).
      - name: Ensure Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx -y "$WRANGLER" pages project list \
            | grep -qE "(^|[^A-Za-z0-9_-])${PAGES_PROJECT}([^A-Za-z0-9_-]|$)" \
            || npx -y "$WRANGLER" pages project create "$PAGES_PROJECT" --production-branch=main
      - uses: supabase/setup-cli@v3
        with:
          version: 2.117.0
      - name: Migrate staging database
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
        run: |
          supabase link --project-ref "$PROJECT_REF"
          supabase db push
      - name: Deploy Edge Functions (skipped while none exist)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if find supabase/functions -mindepth 2 -name 'index.ts' | grep -q .; then
            supabase functions deploy --project-ref "$PROJECT_REF"
          else
            echo "No Edge Functions yet - skipped"
          fi
      - name: Deploy web to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y "$WRANGLER" pages deploy apps/client/build/web --project-name="$PAGES_PROJECT" --branch=main
      # Last on purpose: a seed failure must not block the web or Edge Function deploy.
      - name: Seed staging demo data
        env:
          PGPASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
        run: |
          # `supabase db query --file` rejects multi-statement files, so use
          # psql with the pooler URL that `supabase link` wrote above.
          set -euo pipefail
          command -v psql >/dev/null || { sudo apt-get update && sudo apt-get install -y postgresql-client; }
          url="$(cat supabase/.temp/pooler-url)"
          shopt -s nullglob
          files=(supabase/seeds/demo/[0-9]*.sql)
          (( ${#files[@]} )) || { echo "::error::no demo seed files"; exit 1; }
          for f in "${files[@]}"; do
            psql "$url" -v ON_ERROR_STOP=1 --single-transaction -q -f "$f"
          done
