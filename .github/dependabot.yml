version: 2
# Weekly, one grouped PR per ecosystem. Flutter SDK pins (ci.yml) are updated by hand.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pub
    directory: /apps/client
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      pub:
        patterns: ["*"]
