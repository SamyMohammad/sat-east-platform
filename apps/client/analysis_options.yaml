include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
  errors:
    # CI treats infos as fatal (flutter analyze --fatal-infos).
    invalid_annotation_target: ignore

linter:
  rules:
    # App code, not a published package.
    public_member_api_docs: false
